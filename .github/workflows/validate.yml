name: Validate examples

on:
  pull_request:
    paths:
      - 'examples/stories/**'
      - 'scripts/extract_features.py'
      - 'scripts/lint_stories.py'
      - 'scripts/next_story_id.py'
      - 'scripts/generate_report.py'
      - 'scripts/init.sh'
      - 'kit/**'
      - 'SPEC.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint stories (story-lint)
        run: |
          python3 scripts/lint_stories.py \
            --stories-dir=examples/stories \
            --verbose

      - name: Lifecycle and sub-story grammar are accepted (ADR-0004)
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys, tempfile

          BODY = '''---
          id: {id}
          title: "Lifecycle fixture"
          epic: fixture
          depends_on: []
          status: {status}
          estimate: S
          bdd: false
          updated: "2026-09-28"
          ---

          ## User story

          > **As a** maintainer, **I want** every status accepted, **so that** the
          > spec and the linter agree.
          '''

          STATUSES = ["proposed", "todo", "in_progress", "done",
                      "split", "to_extend", "deferred", "archived"]

          d = pathlib.Path(tempfile.mkdtemp())
          for n, status in enumerate(STATUSES, start=1):
              sid = f"S{n:03d}"
              (d / f"{sid}-a-story.md").write_text(BODY.format(id=sid, status=status))
          # A sub-story reuses its parent's number plus one lowercase letter.
          (d / "S001a-a-sub-story.md").write_text(BODY.format(id="S001a", status="todo"))

          sys.exit(subprocess.call(
              [sys.executable, "scripts/lint_stories.py",
               f"--stories-dir={d}", "--verbose", "--strict"]))
          PY

      - name: An unknown status still fails
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys, tempfile

          d = pathlib.Path(tempfile.mkdtemp())
          (d / "S001-bad-status.md").write_text(
              '---\nid: S001\ntitle: "Bad status"\nepic: fixture\n'
              'depends_on: []\nstatus: almost_done\nestimate: S\nbdd: false\n'
              'updated: "2026-09-28"\n---\n')

          rc = subprocess.call(
              [sys.executable, "scripts/lint_stories.py", f"--stories-dir={d}"])
          if rc == 0:
              sys.exit("linter accepted an unknown status")
          PY

      - name: A story that mentions the heading in prose keeps its scenarios
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys, tempfile

          # The prose mention below used to truncate the section: the extractor
          # produced nothing and the linter reported "no scenario".
          STORY = '''---
          id: S001
          title: "Extractor fixture"
          epic: fixture
          depends_on: []
          status: done
          estimate: S
          bdd: true
          updated: "2026-09-29"
          ---

          ## Description

          The script reads the scenarios under `## Acceptance Criteria` and writes a
          `.feature` file.

          ## Acceptance Criteria

          ### Scenario: The prose mention does not truncate the section

          * **Given** a story naming `## Acceptance Criteria` inside a sentence
          * **When** the extractor runs
          * **Then** the scenario below this heading is still found
          '''

          d = pathlib.Path(tempfile.mkdtemp())
          (d / "S001-extractor-fixture.md").write_text(STORY)
          out = pathlib.Path(tempfile.mkdtemp())

          if subprocess.call([sys.executable, "scripts/lint_stories.py",
                              f"--stories-dir={d}"]):
              sys.exit("linter lost the scenarios of a story that mentions the heading")

          subprocess.check_call([sys.executable, "scripts/extract_features.py",
                                 f"--stories-dir={d}", f"--output-dir={out}", "--verbose"])
          features = list(out.glob("*.feature"))
          if not features:
              sys.exit("extractor produced nothing for a story that has a scenario")
          text = features[0].read_text()
          if "Scenario: The prose mention does not truncate the section" not in text:
              sys.exit(f"scenario missing from the generated feature:\n{text}")
          PY

      - name: Estimate is required while the work is ahead, optional after (ADR-0005)
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys, tempfile

          STORY = '''---
          id: {id}
          title: "Estimate fixture"
          epic: fixture
          depends_on: []
          status: {status}
          bdd: false
          updated: "2026-09-30"
          ---

          ## User story

          > **As a** maintainer, **I want** estimate demanded only where it informs,
          > **so that** nobody reconstructs a forecast after delivery.
          '''

          def lint(statuses):
              d = pathlib.Path(tempfile.mkdtemp())
              for n, status in enumerate(statuses, start=1):
                  sid = f"S{n:03d}"
                  (d / f"{sid}-a-story.md").write_text(STORY.format(id=sid, status=status))
              return subprocess.call(
                  [sys.executable, "scripts/lint_stories.py", f"--stories-dir={d}"])

          # No estimate, and the work is behind us: accepted.
          if lint(["done", "split", "to_extend", "deferred", "archived"]):
              sys.exit("estimate demanded on a status where the work is not ahead")

          # No estimate, and the work is ahead: rejected, one status at a time so a
          # single lenient status cannot hide behind a strict neighbour.
          for status in ("proposed", "todo", "in_progress"):
              if lint([status]) == 0:
                  sys.exit(f"estimate not demanded on `{status}`")
          PY

      - name: Dry-run extraction
        run: |
          python3 scripts/extract_features.py \
            --stories-dir=examples/stories \
            --output-dir=/tmp/features \
            --dry-run --verbose

      - name: Verify at least one .feature was generated
        run: |
          python3 scripts/extract_features.py \
            --stories-dir=examples/stories \
            --output-dir=/tmp/features
          count=$(ls /tmp/features/*.feature 2>/dev/null | wc -l)
          echo "Generated $count .feature file(s)"
          [ "$count" -gt 0 ] || { echo "No .feature files generated"; exit 1; }

  module-autonomy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check module autonomy (ADR-0002)
        run: bash scripts/init.sh --check
