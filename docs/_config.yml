title: StorySpec
description: Write the story once. Run it as a test.
url: ""

# Theme — Just the Docs, pulled at build time by jekyll-remote-theme (bundled in the
# github-pages gem that actions/jekyll-build-pages uses). Pinned for reproducible builds.
remote_theme: just-the-docs/just-the-docs@v0.10.1

plugins:
  - jekyll-remote-theme
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

markdown: kramdown
kramdown:
  input: GFM

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Just the Docs
search_enabled: true
search:
  heading_level: 2
  previews: 2
  button: false
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"
nav_sort: case_insensitive
color_scheme: light
enable_copy_code_button: true
mermaid:
  version: "10.9.1"

aux_links:
  "GitHub repository":
    - "https://github.com/jaegerbobomb/story-spec"
  "Full specification (SPEC.md)":
    - "https://github.com/jaegerbobomb/story-spec/blob/main/SPEC.md"
aux_links_new_tab: true

footer_content: 'StorySpec — user stories as living specifications. <a href="https://github.com/jaegerbobomb/story-spec/blob/main/CHANGELOG.md">Changelog</a>.'
